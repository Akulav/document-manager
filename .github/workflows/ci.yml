# Checks the web app on every push and PR: dependencies install from the lockfile, every source file parses,
# and the server starts on an empty data folder and serves the page, the scripts and the API.
# document-manager is a web app run with Node.js (npm start): there are no binaries or releases.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Install, parse and start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Every source file parses
        run: |
          for f in src/*.js scripts/*.js; do node --check "$f"; done
          node --input-type=module --check < public/app.js
      - name: The server starts and serves the app
        run: |
          export DATA_DIR="$RUNNER_TEMP/data" PORT=3080
          node src/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3080/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3080/ | grep -q "e-Management ANSC"
          curl -sf http://localhost:3080/app.js > /dev/null
          curl -sf http://localhost:3080/vendor/vue.js > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3080/api/me)" != "500"
          cat server.log
