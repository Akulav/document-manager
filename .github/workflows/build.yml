# Builds and tests Windows, Linux and macOS on every push and PR.
#
# Every release ships exactly one file per OS, and that file both installs and updates:
#   eManagement-setup.exe     Windows x64 (Inno Setup; asks for the folder once, updates reuse it)
#   eManagement-linux-x64     Linux x64 (asks for a folder, or --install <folder>, and installs itself there)
#   eManagement-macos-arm64   macOS Apple Silicon (asks for a folder and installs itself there as an .app)
# plus SHA256SUMS.txt, which installed copies verify updates against (src/update.js).
# Each program is a Node.js single executable (scripts/build-sea.js): no Node.js needed on the server.
#
# Releasing is automatic: bump `version` in package.json and push to main. When no release with that version
# exists yet, the `release` job tags the commit (e.g. `1.0.1`) and publishes the release. Pushing a tag works too.

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
            release=true
          elif [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $version already exists, nothing to publish."
            else
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "### e-Management ANSC $version (release: $release)" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows x64
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build (single executable)
        run: node scripts/build-sea.js
      - name: Setup (install + update in one file)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ needs.meta.outputs.version }}" "/DSourceExe=$PWD\dist\eManagement.exe" installer\emanagement.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\eManagement-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: eManagement-setup.exe
          path: eManagement-setup.exe
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build (single executable)
        run: |
          node scripts/build-sea.js
          cp dist/eManagement-linux-x64 .
      - uses: actions/upload-artifact@v4
        with:
          name: eManagement-linux-x64
          path: eManagement-linux-x64
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon
    needs: meta
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build (single executable, signed ad hoc)
        run: |
          node scripts/build-sea.js
          cp dist/eManagement-macos-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: eManagement-macos-arm64
          path: eManagement-macos-arm64
          if-no-files-found: error

  release:
    name: Publish release
    needs: [meta, windows, linux, macos]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          chmod +x eManagement-linux-x64 eManagement-macos-arm64
          sha256sum eManagement-setup.exe eManagement-linux-x64 eManagement-macos-arm64 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "## e-Management ANSC $VERSION"
            echo
            echo "_Made by **Akulav**: sistem intern de management al documentelor._"
            echo
            echo "Un singur fișier pe sistem. Același fișier instalează aplicația și o actualizează ulterior."
            echo
            echo "| Sistem | Descărcare | Prima pornire |"
            echo "| --- | --- | --- |"
            echo "| Windows 10/11, Server 2016+ (x64) | [eManagement-setup.exe]($BASE/eManagement-setup.exe) | Întreabă unde să instaleze. Actualizările folosesc același folder. |"
            echo "| Linux x64 | [eManagement-linux-x64]($BASE/eManagement-linux-x64) | \`chmod +x\`, apoi rulați-l: întreabă unde să se instaleze (sau \`--install <folder>\`). |"
            echo "| macOS Apple Silicon | [eManagement-macos-arm64]($BASE/eManagement-macos-arm64) | \`chmod +x\`, apoi rulați-l din Terminal: întreabă unde să se instaleze. |"
            echo
            echo "Programul, baza de date și fișierele încărcate stau doar în folderul ales."
            echo "Administratorul actualizează din **Setări → Actualizări**, cu verificare SHA-256."
            echo
            echo "<details><summary>SHA-256</summary>"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo "</details>"
            echo
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          name: e-Management ANSC ${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: dist/notes.md
          generate_release_notes: true
          make_latest: true
          files: |
            dist/eManagement-setup.exe
            dist/eManagement-linux-x64
            dist/eManagement-macos-arm64
            dist/SHA256SUMS.txt
